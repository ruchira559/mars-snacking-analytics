<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#1c385f;margin:0;background:#fff}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}h2{font-size:17px;margin:0}p{font-size:12px;color:#7586a0;margin:5px 0 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card{border-radius:12px;padding:17px 18px;border-left:4px solid var(--accent);background:var(--bg)}.card strong{font-size:25px}.card small{display:block;font-size:11px;letter-spacing:.07em;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #e2e9f3;border-radius:14px;padding:18px;background:#fff;min-width:0;box-shadow:0 4px 15px #15345108}.panel h3{font-size:14px;margin:0 0 12px}.donutWrap{display:flex;align-items:center;justify-content:center;gap:12px;min-height:315px}.donut{width:245px;height:245px;flex-shrink:0;transform:rotate(-90deg)}.arc{transition:opacity .15s,stroke-width .15s}.arc:hover{opacity:.8;stroke-width:47}.legend{font-size:11px;max-width:175px}.legendItem{display:flex;align-items:center;gap:6px;padding:6px 2px}.swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0}.bars{height:335px;overflow:auto}.barrow{display:grid;grid-template-columns:minmax(90px,140px) 1fr 60px;gap:8px;align-items:center;margin:10px 0;font-size:11px}.barlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{background:#f0f4fa;border-radius:4px;height:18px;overflow:hidden}.fill{height:100%;background:#284b7a;border-radius:3px;min-width:1px}.barrow:hover .fill{background:#e61c42}.barvalue{text-align:right;font-variant-numeric:tabular-nums}.empty{font-size:13px;color:#8190a3;padding:28px}.center{font-size:18px;fill:#19365e;font-weight:700}.centerSub{font-size:12px;fill:#5b718f}@media(max-width:760px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.donut{width:190px;height:190px}}
</style></head><body><header><div><h2>Time Utilization Overview</h2></div></header><div id="cards" class="cards"></div><div class="grid"><section class="panel"><h3>Line of Business</h3><div id="lob"></div></section><section class="panel"><h3>Project Tier</h3><div id="tier"></div></section><section class="panel"><h3>Product Ranking</h3><div id="product"></div></section><section class="panel"><h3>Agency Ranking</h3><div id="agency"></div></section></div>
<script>
'use strict';
const data=/*__SUMMARY_DATA__*/null;
const rows=data?data.rows:[];
const mapping={'Line of Business':'lob','Project Tier':'tier','Product':'product','Agency Name':'agency'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:1});}
function aggregate(key){const m=new Map();for(const r of rows){const name=r[mapping[key]];m.set(name,(m.get(name)||0)+r.hours);}return[...m].sort((a,b)=>b[1]-a[1]);}
function bars(id,key,limit){const d=aggregate(key).slice(0,limit||100);const max=Math.max(...d.map(x=>x[1]),1);const root=document.getElementById(id);root.className='bars';root.innerHTML=d.length?'':'<div class="empty">No matching records</div>';for(const[name,v]of d){const el=document.createElement('div');el.className='barrow';el.title=name+' \u00b7 '+fmt(v)+' hours';el.innerHTML='<span class="barlabel">'+esc(name)+'</span><div class="track"><div class="fill" style="width:'+Math.max(0,100*v/max)+'%"></div></div><span class="barvalue">'+fmt(v)+'</span>';root.append(el);}}
function donut(){const key='Line of Business',d=aggregate(key);const total=d.reduce((a,b)=>a+b[1],0);const palette=['#1d395f','#e91e43','#f7a51c','#cdd2d9','#259b90','#7e83c8','#9fa7b4','#db7b62'];let acc=0;const root=document.getElementById('lob');root.className='donutWrap';root.innerHTML='';if(!total){root.innerHTML='<div class="empty">No matching records</div>';return;}const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 250 250');svg.classList.add('donut');const circle=(r,stroke,w)=>{const c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx','125');c.setAttribute('cy','125');c.setAttribute('r',r);c.setAttribute('fill','none');c.setAttribute('stroke',stroke);c.setAttribute('stroke-width',w);return c;};svg.append(circle(88,'#edf1f7',42));for(let i=0;i<d.length;i++){const[name,v]=d[i],pct=v/total,c=circle(88,palette[i%palette.length],42);c.setAttribute('stroke-dasharray',(pct*2*Math.PI*88)+' '+(2*Math.PI*88));c.setAttribute('stroke-dashoffset',String(-acc*2*Math.PI*88));c.classList.add('arc');const t=document.createElementNS(svg.namespaceURI,'title');t.textContent=name+' \u00b7 '+fmt(v)+' hours ('+fmt(pct*100)+'%)';c.append(t);svg.append(c);acc+=pct;}for(const[txt,y,cls]of[[fmt(total),120,'center'],['Hours',142,'centerSub']]){const t=document.createElementNS(svg.namespaceURI,'text');t.setAttribute('x','125');t.setAttribute('y',y);t.setAttribute('text-anchor','middle');t.setAttribute('class',cls);t.style.transform='rotate(90deg)';t.style.transformOrigin='125px 125px';t.textContent=txt;svg.append(t);}root.append(svg);const legend=document.createElement('div');legend.className='legend';d.forEach(([name,v],i)=>{const e=document.createElement('div');e.className='legendItem';e.title=name;e.innerHTML='<span class="swatch" style="background:'+palette[i%palette.length]+'"></span><span>'+esc(name)+' ('+fmt(v/total*100)+'%)</span>';legend.append(e)});root.append(legend);}
function render(){const defs=[['agency','Agencies','#3875e9','#eff5ff'],['brand','Brands','#e91e43','#fff0f3'],['campaign','Campaigns','#e89a00','#fff8e8'],['product','Products','#0c9489','#e9faf5']];document.getElementById('cards').innerHTML=defs.map(([k,t,color,bg])=>'<div class="card" style="--accent:'+color+';--bg:'+bg+'"><strong>'+new Set(rows.map(r=>r[k]).filter(x=>x!=='(Blank)')).size+'</strong><small>'+t.toUpperCase()+'</small></div>').join('');donut();bars('tier','Project Tier');bars('product','Product',15);bars('agency','Agency Name',15);}
if(data)render();
</script></body></html>
